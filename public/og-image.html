<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=1.0">
  <title>OG Image Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
    }

    .container {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #0d3d2f 0%, #1a5c46 50%, #0d3d2f 100%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 80px;
    }

    .container::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><defs><radialGradient id="g" cx="80%" cy="40%"><stop offset="0%" stop-color="%23ffffff" stop-opacity="0.05"/><stop offset="100%" stop-color="%23ffffff" stop-opacity="0"/></radialGradient></defs><rect fill="url(%23g)" width="1200" height="630"/></svg>');
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 8px 16px;
      margin-bottom: 32px;
      width: fit-content;
    }

    .badge-icon {
      width: 16px;
      height: 16px;
      fill: rgba(255, 255, 255, 0.8);
    }

    .badge-text {
      font-family: 'Figtree', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .badge-dot {
      color: rgba(255, 255, 255, 0.5);
    }

    h1 {
      font-size: 64px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      margin-bottom: 24px;
      max-width: 900px;
    }

    .description {
      font-family: 'Figtree', sans-serif;
      font-size: 20px;
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
      max-width: 750px;
      margin-bottom: 40px;
    }

    .buttons {
      display: flex;
      gap: 16px;
    }

    .btn {
      padding: 14px 28px;
      border-radius: 12px;
      font-family: 'Figtree', sans-serif;
      font-size: 16px;
      font-weight: 500;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #e6a817;
      color: #1a1a1a;
    }

    .btn-secondary {
      background: transparent;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-arrow {
      font-size: 18px;
    }

    .pagination {
      position: absolute;
      bottom: 40px;
      left: 80px;
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 32px;
      height: 6px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.3);
    }

    .dot.active {
      background: #e6a817;
    }

    .portrait {
      position: absolute;
      right: 80px;
      top: 50%;
      transform: translateY(-50%);
      width: 280px;
      height: 350px;
      border-radius: 20px;
      overflow: hidden;
      opacity: 0.15;
    }

    .portrait-placeholder {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="portrait">
      <div class="portrait-placeholder"></div>
    </div>

    <div class="badge">
      <svg class="badge-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.18l7 3.5v7.64l-7 3.5-7-3.5V7.68l7-3.5z"/>
        <path d="M12 6v12M6 9l6 3 6-3M6 15l6-3 6 3"/>
      </svg>
      <span class="badge-text">Shaggar City</span>
      <span class="badge-dot">·</span>
      <span class="badge-text">Community Portal</span>
    </div>

    <h1>Burayu Sub City — building a model smart city</h1>

    <p class="description">
      Competitive, livable and responsive to the needs of all residents. A compact, 
      polycentric economic hub built on inclusivity, connectivity and environmental sustainability.
    </p>

    <div class="buttons">
      <a href="#" class="btn btn-primary">
        About the administration
        <span class="btn-arrow">→</span>
      </a>
      <a href="#" class="btn btn-secondary">
        Go to e-services
      </a>
    </div>

    <div class="pagination">
      <div class="dot"></div>
      <div class="dot active"></div>
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>
</body>
</html>
